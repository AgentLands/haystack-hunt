<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haystack Hunt · samanlıkta iğne</title>
  <meta name="description" content="Kuş bakışı bir saman tarlasında tek bir iğneyi ara: elinle
    kaz, tırmıkla it, dedektörle yokla, traktörle, üfleyiciyle ve balya makinesiyle samanı kaldır.">
  <link rel="stylesheet" href="belirtec.css">
  <link rel="stylesheet" href="stil.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="ikon/ikon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="ikon/ikon-192.png">
  <meta name="theme-color" content="#1d1711">
</head>
<body>
  <header>
    <h1>Haystack Hunt</h1>
    <p id="etiket" class="etiket"></p>
    <!-- Özellik modülleri küçük ikon düğmelerini buraya JS ile ekler (ses, istatistik...). -->
    <div id="ust-dugmeler" class="dugme-sirasi"></div>
  </header>

  <section class="panel" aria-label="Durum">
    <div><span class="baslik">Süre</span><strong id="sure">0:00</strong></div>
    <div><span class="baslik">Kaldırılan saman</span><strong id="kaldirilan">0</strong></div>
    <div><span class="baslik">Dedektör</span><strong id="dedektor-hak">3</strong></div>
  </section>

  <nav class="araclar" aria-label="Araçlar">
    <button data-arac="el" aria-pressed="true"><kbd>1</kbd> El</button>
    <button data-arac="tirmik" aria-pressed="false"><kbd>2</kbd> Tırmık</button>
    <button data-arac="dedektor" aria-pressed="false"><kbd>3</kbd> Dedektör</button>
    <button data-arac="miknatis" aria-pressed="false"><kbd>4</kbd> Mıknatıs
      <span id="miknatis-hak" class="hak">1</span></button>
  </nav>

  <main>
    <!-- Tuval kabı: özellikler tuvalin üstüne bindirme (yakınlaştırma düğmeleri vb.) ekler. -->
    <div id="tarla-kap" class="tarla-kap">
      <canvas id="tarla" aria-label="Saman tarlası"></canvas>
      <div id="bildirim" class="bildirim" role="status" aria-live="polite"></div>
    </div>
  </main>

  <nav class="alt" id="alt-dugmeler">
    <button id="gunun">Günün tarlası</button>
    <button id="yeni">Yeni tarla</button>
    <button id="pes" class="ikincil">Pes et, iğneyi göster</button>
  </nav>

  <dialog id="bitis">
    <h2>İğneyi buldun! 🪡</h2>
    <p id="sonuc"></p>
    <p id="puan" class="puan"></p>
    <div class="dugmeler">
      <button id="paylas">Sonucu kopyala</button>
      <button id="tekrar">Yeni tarla</button>
    </div>
  </dialog>

  <script type="module" src="js/ana.js"></script>
</body>
</html>
