<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makine önizleme</title>
<style>
  body { margin: 0; padding: 12px 16px; background: #2a2118; color: #eadfc6;
    font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  h2 { font-size: 14px; margin: 18px 0 6px; color: #f0c870; }
  .arac { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  button { background: #4b3a28; color: inherit; border: 1px solid #7a6240; padding: 4px 10px;
    border-radius: 4px; cursor: pointer; }
  button.secili { background: #8a6a30; }
  canvas { display: block; max-width: 100%; border: 1px solid #00000066; }
  pre { color: #b8d8a0; margin: 4px 0; }
</style>
</head>
<body>
<h1>Makineler, garaj ve balyalar: önizleme</h1>
<div class="arac">
  Yakınlaştırma:
  <button data-z="3.5">3.5× (oyun)</button>
  <button data-z="6">6×</button>
  <button data-z="10">10×</button>
  <label><input type="checkbox" id="anim" checked> Canlandır</label>
  <button id="olc">Süre ölç</button>
</div>
<pre id="olcum"></pre>
<div id="bolumler"></div>
<script type="module" src="makine-onizleme.js"></script>
</body>
</html>
